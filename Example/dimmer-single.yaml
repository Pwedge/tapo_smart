# NOTE: Run this from the command line with variable substitution like so:
#   esphome -s simple_name my-dimmer -s name "My Dimmer" run config/dimmer-generic.yaml --device (UART or IP address)

substitutions:  
  device_name: ${simple_name}
  friendly_name: ${name}
  icon: mdi:lightbulb-on-70

packages:
  base: !include base.yaml
  device: !include devices/tp-link_tapo_500d.yaml

device_groups: !remove
text_sensor: !remove